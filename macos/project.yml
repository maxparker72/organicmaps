name: mapo

options:
  bundleIdPrefix: com.maxparker72
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: ../xcode/common-debug.xcconfig
  Release: ../xcode/common-release.xcconfig

projectReferences:
  base: { path: ../xcode/base/base.xcodeproj }
  bsdiff: { path: ../xcode/bsdiff/bsdiff.xcodeproj }
  coding: { path: ../xcode/coding/coding.xcodeproj }
  descriptions: { path: ../xcode/descriptions/descriptions.xcodeproj }
  drape: { path: ../xcode/drape/drape.xcodeproj }
  drape_frontend: { path: ../xcode/drape_frontend/drape_frontend.xcodeproj }
  editor: { path: ../xcode/editor/editor.xcodeproj }
  expat: { path: ../xcode/expat/expat.xcodeproj }
  freetype: { path: ../xcode/freetype/freetype.xcodeproj }
  ge0: { path: ../xcode/ge0/ge0.xcodeproj }
  geometry: { path: ../xcode/geometry/geometry.xcodeproj }
  harfbuzz: { path: ../xcode/harfbuzz/harfbuzz.xcodeproj }
  icu: { path: ../xcode/icu/icu.xcodeproj }
  indexer: { path: ../xcode/indexer/indexer.xcodeproj }
  kml: { path: ../xcode/kml/kml.xcodeproj }
  map: { path: ../xcode/map/map.xcodeproj }
  minizip: { path: ../xcode/minizip/minizip.xcodeproj }
  mwm_diff: { path: ../xcode/mwm_diff/mwm_diff.xcodeproj }
  open_location_code: { path: ../xcode/open_location_code/open_location_code.xcodeproj }
  opening_hours: { path: ../xcode/opening_hours/opening_hours.xcodeproj }
  platform: { path: ../xcode/platform/platform.xcodeproj }
  pugixml: { path: ../xcode/pugixml/pugixml.xcodeproj }
  routing: { path: ../xcode/routing/routing.xcodeproj }
  routing_common: { path: ../xcode/routing_common/routing_common.xcodeproj }
  search: { path: ../xcode/search/search.xcodeproj }
  shaders: { path: ../xcode/shaders/shaders.xcodeproj }
  sperr: { path: ../xcode/sperr/sperr.xcodeproj }
  stb_image: { path: ../xcode/stb_image/stb_image.xcodeproj }
  storage: { path: ../xcode/storage/storage.xcodeproj }
  succinct: { path: ../xcode/succinct/succinct.xcodeproj }
  terrain: { path: ../xcode/terrain/terrain.xcodeproj }
  tess2: { path: ../xcode/tess2/tess2.xcodeproj }
  timezone: { path: ../xcode/timezone/timezone.xcodeproj }
  traffic: { path: ../xcode/traffic/traffic.xcodeproj }
  transit: { path: ../xcode/transit/transit.xcodeproj }
  vulkan_wrapper: { path: ../xcode/vulkan_wrapper/vulkan_wrapper.xcodeproj }

targets:
  # Objective-C++ bridge to the C++ core, shared with the iOS app. Built as a
  # static framework (matches iOS MACH_O_TYPE=staticlib); C++ symbols are
  # resolved by the app, which links the engine libs.
  CoreApi:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: ../xcode/common-debug.xcconfig
      Release: ../xcode/common-release.xcconfig
    sources:
      - path: ../iphone/CoreApi/CoreApi
        headerVisibility: public
    settings:
      base:
        PRODUCT_NAME: CoreApi
        PRODUCT_BUNDLE_IDENTIFIER: com.maxparker72.mapo.CoreApi
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ../iphone/CoreApi/CoreApi.modulemap
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
        OMIM_ROOT: $(PROJECT_DIR)/..
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(OMIM_ROOT)
          - $(OMIM_ROOT)/libs
          - $(OMIM_ROOT)/3party/glm
          - $(OMIM_ROOT)/3party/pugixml/pugixml/src

  mapo:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: ../xcode/common-debug.xcconfig
      Release: ../xcode/common-release.xcconfig
    sources:
      - path: App
      - path: MapView
      - path: Core
      # MetalContextFactory is shared with the iOS app target; compile it here.
      - path: ../iphone/Maps/Core/MapRendering/MetalContextFactory.h
      - path: ../iphone/Maps/Core/MapRendering/MetalContextFactory.mm
    settings:
      base:
        PRODUCT_NAME: mapo
        PRODUCT_BUNDLE_IDENTIFIER: com.maxparker72.mapo
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The only place the version lives. Date-based like upstream, because the engine sends it to the
        # map servers (X-OM-AppVersion). Core/PlatformVersion.mm reads it from Info.plist.
        MARKETING_VERSION: "2026.11.15"
        CURRENT_PROJECT_VERSION: "1"
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.5"
        SWIFT_OBJC_BRIDGING_HEADER: App/mapo-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES
        # common.xcconfig defines OMIM_ROOT = $(PROJECT_DIR)/../.. which assumes a
        # project two levels under the repo (iphone/Maps, xcode/<lib>). This project
        # is at macos/ (one level), so correct OMIM_ROOT to the repo root here.
        OMIM_ROOT: $(PROJECT_DIR)/..
        # common.xcconfig's macOS OTHER_LDFLAGS bakes in Qt framework links with
        # absolute paths to /opt/homebrew/opt/qtbase/... — fine for the qt/ tool,
        # but breaks distribution: testers without Homebrew Qt cannot launch the
        # app. The engine static libs do not use any Qt symbols (confirmed via
        # nm), so override OTHER_LDFLAGS to drop Qt entirely. SDK frameworks
        # below (Cocoa, Metal, etc.) cover what the app actually links.
        OTHER_LDFLAGS: -framework IOKit -framework Network -framework OpenGL
        # Project includes resolve relative to repo root and libs/ (matches lib projects).
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)
          - $(OMIM_ROOT)
          - $(OMIM_ROOT)/libs
          - $(OMIM_ROOT)/3party/glm
          - $(OMIM_ROOT)/3party/pugixml/pugixml/src
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy Metal shader library
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          cp -f "${BUILT_PRODUCTS_DIR}/shaders_metal.metallib" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/shaders_metal.metallib"
      # For Release builds, bundle the same data files the iOS app ships with
      # so a distributed .app boots offline without MWM_RESOURCES_DIR set. Skipped
      # in Debug because the scheme injects MWM_RESOURCES_DIR pointing at the repo.
      - name: Bundle engine data (Release)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Skipping data bundling for ${CONFIGURATION} build."
            exit 0
          fi
          DATA_DIR="${SRCROOT}/../data"
          RES_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$RES_DIR"
          ITEMS=( \
            categories_brands.txt categories_cuisines.txt categories.txt \
            classificator.txt colors.txt copyright.html countries.json \
            countries-strings \
            drules_default.bin drules_outdoors.bin drules_vehicle.bin \
            editor.config faq.html fonts icudt78l.dat \
            opening_hours_how_to_edit.html packed_polygons.bin patterns.txt \
            strings symbols synonyms.txt transit_colors.txt twm_grid.json types.txt \
            World.mwm WorldCoasts.mwm \
          )
          for item in "${ITEMS[@]}"; do
            src="$DATA_DIR/$item"
            if [ ! -e "$src" ]; then
              echo "error: required data item missing: $src" >&2
              exit 1
            fi
            rsync -a --delete "$src" "$RES_DIR/"
          done
    dependencies:
      - target: CoreApi
        embed: false
      - target: base/base
      - target: bsdiff/bsdiff
      - target: coding/coding
      - target: descriptions/descriptions
      - target: drape/drape
      - target: drape_frontend/drape_frontend
      - target: editor/editor
      - target: expat/expat
      - target: freetype/freetype
      - target: ge0/ge0
      - target: geometry/geometry
      - target: harfbuzz/harfbuzz
      - target: icu/icu
      - target: indexer/indexer
      - target: kml/kml
      - target: map/map
      - target: minizip/minizip
        embed: true
      - target: mwm_diff/mwm_diff
      - target: open_location_code/open_location_code
      - target: opening_hours/opening_hours
      - target: platform/platform
      - target: pugixml/pugixml
      - target: routing/routing
      - target: routing_common/routing_common
      - target: search/search
      - target: shaders/shaders
      - target: sperr/sperr
      - target: stb_image/stb_image
      - target: storage/storage
      - target: succinct/succinct
      - target: terrain/terrain
      - target: tess2/tess2
      - target: timezone/timezone
      - target: traffic/traffic
      - target: transit/transit
      - target: vulkan_wrapper/vulkan_wrapper
      # Metal shader library: build it; a post-build script copies it into Resources.
      - target: shaders/shaders_metal
        link: false
        embed: false
      - sdk: Cocoa.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: CoreLocation.framework
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CFNetwork.framework
      - sdk: libz.tbd

schemes:
  mapo:
    build:
      targets:
        mapo: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
